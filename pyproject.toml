[project]
name = "admet-autoresearch"
version = "0.1.0"
description = "Autonomous experimentation on the TDC Caco2_Wang benchmark"
requires-python = ">=3.11,<3.12"
dependencies = [
    # PyTDC 1.x pulls a dependency chain that will not build on macOS x86_64.
    "PyTDC==0.4.17",
    # Newer numba/llvmlite ship no macOS x86_64 wheels.
    "numba==0.60.0",
    "llvmlite==0.43.0",
    # setuptools 81 removed pkg_resources, which PyTDC imports.
    "setuptools<81",
    "rdkit",
    "scikit-learn",
    "pandas",
    "numpy",
]
